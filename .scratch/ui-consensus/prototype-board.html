<h1>UI 共識原型（用完即丟）</h1>
<p class="lead">三位設計師的共識版（B），跟現況（A）比起來是不是真的比較好？還沒實機確認的幾處，哪個選項看起來對？用底部切換列或 ← → 鍵在 A／B 之間切換；上方切換介面、情境、語言、主題與設定面板。點卡片右上的 ▸ 可以展開明細，點「設定 ▸」「閒置 ▾」也會動。資料是假的。</p>

<script>
// ── 寬度工具（照 cli-board 原型：中日韓 2 欄，其餘 1 欄）──────────────────
const isWide = c => (c >= 0x1100 && c <= 0x115F) || (c >= 0x2E80 && c <= 0x303E) || (c >= 0x3041 && c <= 0x33FF) ||
  (c >= 0x3400 && c <= 0x4DBF) || (c >= 0x4E00 && c <= 0x9FFF) || (c >= 0xA000 && c <= 0xA4CF) ||
  (c >= 0xAC00 && c <= 0xD7A3) || (c >= 0xF900 && c <= 0xFAFF) || (c >= 0xFE30 && c <= 0xFE4F) ||
  (c >= 0xFF00 && c <= 0xFF60) || (c >= 0xFFE0 && c <= 0xFFE6)
const cw = ch => (isWide(ch.codePointAt(0)) ? 2 : 1)
const dw = s => { let n = 0; for (const ch of s) n += cw(ch); return n }
const truncate = (s, w) => {
  if (dw(s) <= w) return s
  if (w <= 0) return ''
  let out = '', n = 0
  for (const ch of s) { if (n + cw(ch) > w - 1) break; out += ch; n += cw(ch) }
  return out + '…'
}
/** 中間截斷（truncate-middle），給路徑用 */
const truncMiddle = (s, w) => {
  if (dw(s) <= w) return s
  const chars = [...s]
  let head = '', tail = '', n = 0, i = 0, j = chars.length - 1
  const half = Math.floor((w - 1) / 2)
  while (i < chars.length && n + cw(chars[i]) <= half) { n += cw(chars[i]); head += chars[i++] }
  n = 0
  while (j > i && n + cw(chars[j]) <= w - 1 - dw(head)) { n += cw(chars[j]); tail = chars[j--] + tail }
  return head + '…' + tail
}

// ── 版面的中介表示：兩種介面共用同一棵樹，各自畫 ──────────────────────
// 片段 S：一段文字＋class；按鈕 Btn：plain／secondary／primary／select；
// 區塊：L（一行，可左右兩端對齊）、F（可換行的一排，可帶右端動作）、Bx（外框）、G（直排群組，含間距）
const S = (t, c = '', o = {}) => ({ t, c, ...o })
const Btn = (kind, segs, act = '', title = '') => ({ btn: kind, segs, act, title })
const L = (left, right = null, o = {}) => ({ k: 'L', left, right, ...o })
const F = (items, gap, end = null) => ({ k: 'F', items, gap, end })
const Bx = (o, children) => ({ k: 'Bx', ...o, children })
const G = (gap, children, padX = null) => ({ k: 'G', gap, children: children.filter(Boolean), padX })
const GAP0 = { t: 0, d: 0 }

// ── 終端機畫法 ───────────────────────────────────────────────────────
const flat = items => items.flatMap(it => {
  if (!it.btn) return [it]
  const own = s => ({ ...s, act: it.act || s.act, title: it.title || s.title })
  if (it.btn === 'plain') return it.segs.map(own)
  const pri = it.btn === 'primary' ? ' pri' : ''
  const tail = it.btn === 'select' ? [S(' ▾', 'dim')] : []
  return [S('[ ', pri.trim()), ...it.segs.map(s => ({ ...s, c: s.c + pri })), ...tail, S(' ]', pri.trim())].map(own)
})
const segsW = segs => segs.reduce((n, s) => n + dw(s.t), 0)
const fit = (segs, w) => {
  const out = []
  let n = 0
  for (const s of segs) {
    const sw = dw(s.t)
    if (n + sw <= w) { out.push(s); n += sw; continue }
    const cut = truncate(s.t, w - n)
    if (cut) { out.push({ ...s, t: cut }); n += dw(cut) }
    break
  }
  if (n < w) out.push(S(' '.repeat(w - n)))
  return out
}
const wrapSegs = (segs, w) => {
  const lines = []
  let cur = [], n = 0
  for (const s of segs) {
    let buf = ''
    for (const ch of s.t) {
      if (n + cw(ch) > w) { if (buf) cur.push({ ...s, t: buf }); lines.push(cur); cur = []; n = 0; buf = '' }
      buf += ch; n += cw(ch)
    }
    if (buf) cur.push({ ...s, t: buf })
  }
  if (cur.length) lines.push(cur)
  return lines
}
function termLines(b, W) {
  if (b.k === 'L') {
    const left = flat(b.left)
    if (b.right) {
      const right = flat(b.right)
      const rw = segsW(right)
      return [[...fit(left, W - rw - 1), S(' '), ...right]]
    }
    if (b.middle) return [[...left.slice(0, -1), { ...left[left.length - 1], t: truncMiddle(left[left.length - 1].t, W - segsW(left.slice(0, -1))) }]]
    if (b.trunc) return [fit(left, W)]
    return wrapSegs(left, W)
  }
  if (b.k === 'F') {
    const gap = ' '.repeat(b.gap.t)
    const lines = []
    let cur = [], n = 0
    for (const it of b.items) {
      const segs = flat(it), sw = segsW(segs)
      if (n > 0 && n + gap.length + sw > W) { lines.push(cur); cur = []; n = 0 }
      if (n > 0) { cur.push(S(gap)); n += gap.length }
      cur.push(...segs); n += sw
    }
    if (cur.length) lines.push(cur)
    if (b.end) {
      const end = flat(b.end), ew = segsW(end)
      const last = lines[lines.length - 1]
      const lw = last ? segsW(last) : 0
      if (last && lw + gap.length + ew <= W) lines[lines.length - 1] = [...fit(last, W - ew), ...end]
      else lines.push(end)
    }
    return lines
  }
  if (b.k === 'Bx') {
    const set = { round: '╭─╮│╰╯', bold: '┏━┓┃┗┛', double: '╔═╗║╚╝' }[b.border]
    const [tl, h, tr, v, bl, br] = [...set]
    const c = (b.color || (b.dim ? 'ln-dim' : 'line')) + (b.pend ? ' pend' : '')
    const inner = termLines(G(b.gap || GAP0, b.children), W - 4)
    return [
      [S(tl + h.repeat(W - 2) + tr, c)],
      ...inner.map(l => [S(v, c), S(' '), ...fit(l, W - 4), S(' '), S(v, c)]),
      [S(bl + h.repeat(W - 2) + br, c)],
    ]
  }
  if (b.k === 'G') {
    const px = b.padX ? b.padX.t : 0
    const out = []
    b.children.forEach((ch, i) => {
      if (i > 0) for (let k = 0; k < b.gap.t; k++) out.push([])
      out.push(...termLines(ch, W - 2 * px).map(l => (px ? [S(' '.repeat(px)), ...l] : l)))
    })
    return out
  }
  return []
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
const attrs = s => `${s.act ? ` data-act="${esc(s.act)}"` : ''}${s.title ? ` title="${esc(s.title)}"` : ''}`
const termSegHtml = s => {
  let html = '', run = ''
  for (const ch of s.t) {
    const c = ch.codePointAt(0)
    if (c < 0x80 || (c >= 0x2500 && c <= 0x259F)) { run += ch; continue }
    if (run) { html += esc(run); run = '' }
    html += `<span class="w${cw(ch)}">${esc(ch)}</span>`
  }
  if (run) html += esc(run)
  return s.c || s.act || s.title ? `<span class="${s.c}"${attrs(s)}>${html}</span>` : html
}
const termHtml = lines => lines.map(l => `<div class="l">${l.map(termSegHtml).join('')}</div>`).join('')

// ── Desktop 畫法 ─────────────────────────────────────────────────────
const segHtml = s => `<span class="${s.c}${s.shrink ? ' shrink' : ''}"${attrs(s)}>${esc(s.t)}</span>`
const itemHtml = it => {
  if (!it.btn) return segHtml(it)
  const shrink = it.segs.some(s => s.shrink) ? ' plain-title' : ''
  return `<button class="btn ${it.btn}${shrink}"${attrs(it)}>${it.segs.map(segHtml).join('')}${it.btn === 'select' ? '<i class="caret">▼</i>' : ''}</button>`
}
function deskHtml(b) {
  if (b.k === 'L') {
    if (b.right) return `<div class="row"><span class="l">${b.left.map(itemHtml).join('')}</span><span class="r">${b.right.map(itemHtml).join('')}</span></div>`
    if (b.middle) {
      const last = b.left[b.left.length - 1]
      return `<div class="ln trunc">${[...b.left.slice(0, -1), { ...last, t: truncMiddle(last.t, 64) }].map(itemHtml).join('')}</div>`
    }
    return `<div class="ln${b.trunc ? ' trunc' : ''}">${b.left.map(itemHtml).join('')}</div>`
  }
  if (b.k === 'F') {
    return `<div class="flow" style="column-gap:${b.gap.d}px">${b.items.map(it => `<span class="it">${it.map(itemHtml).join('')}</span>`).join('')}${b.end ? `<span class="it end">${b.end.map(itemHtml).join('')}</span>` : ''}</div>`
  }
  if (b.k === 'Bx') {
    const cls = ['bx', b.border, b.color ? `c-${b.color}` : '', b.dim ? 'dimb' : '', b.pend ? 'pend' : ''].join(' ')
    return `<div class="${cls}" style="gap:${(b.gap || GAP0).d}px">${b.children.map(deskHtml).join('')}</div>`
  }
  if (b.k === 'G') {
    return `<div class="grp" style="gap:${b.gap.d}px${b.padX ? `;padding:0 ${b.padX.d}px` : ''}">${b.children.map(deskHtml).join('')}</div>`
  }
  return ''
}

    if (term && w - leftW - rightW() - 3 < 8) badges = []
    if (term && w - leftW - rightW() - 3 < 8 && current) current = '✦'
    const title = term ? truncate(c.title, w - leftW - rightW() - 3) : c.title
    const left = [
      chip ? S(`▲${chip}`.replace('▲ ', c.status === 'errored' ? '✕ ' : '▲ '), `${color} b`) : S(glyph, color), S(' '),

    if (c.branch) out.push(L([S(`${c.branch.name} · ${m.versus(c.branch.base)}`, 'cap dim')], null, { trunc: true }))
    out.push(L([S([m.environment.local, c.worktree ? m.environment.worktree : null].filter(Boolean).join(' · '), 'cap dim')]))
    if (c.connectors) out.push(F([[S(`${m.connectors(c.connectors.connected.length)}: ${c.connectors.connected.join(', ')}`, 'cap dim')], [S(`${m.needsAuth} ${c.connectors.needsAuth.join(', ')}`, 'cap warn')]], { t: 1, d: 6 }))
    out.push(L([S(c.path, 'cap dim')], null, { middle: true }))
    for (const [st, kind, label] of c.taskList || []) out.push(L([S(`${{ running: '⟳', done: '✓' }[st]} ${m.taskKinds[kind]} ${label}`, st === 'done' ? 'cap dim' : 'cap')], null, { trunc: true }))
    return out
  }
  const body = c => [
    ...contextLine(c), ...metaStrip(c), ...detail(c),
    groupOf(c.status) === 'waiting' ? L([Btn('secondary', [S(m.goHandle)], 'jump')]) : null,
  ].filter(Boolean)
  const card = (c, w) => [titleRow(c, w), ...body(c)]

  // 帳號用量
  const account = Bx({ border: 'round' }, [
    L([S(m.account.title, 'fn sb dim')]),
    ...RATES.map(r => L([S(`${m.account[r.kind]} ${usageBar(r.p)}`, `cap ${usageColor(r.p)}`)], [S(m.account.resetsIn(r.reset), 'cap dim')])),
  ])
  // 設定面板（目前：在頁首上方）
  const editing = state.editingA
  const fields = DEFAULT_FIELDS[editing]
  const density = densityOf(fields)
  const panel = Bx({ border: 'round', dim: true, gap: { t: 1, d: 8 } }, [
    F([[Btn('plain', [S(`☑ ${m.panel.autoOpen}`)])], [Btn('plain', [S(`☐ ${m.panel.autoOpenCli}`)])]], { t: 1, d: 8 }),
    F([[S(m.panel.language, 'cap dim')], [Btn('primary', [S(m.panel.auto)])], ...m.locales.map(l => [Btn('secondary', [S(l)])])], { t: 1, d: 6 }),
    F([[S(m.panel.billing, 'cap dim')], ...Object.keys(m.billings).map(b => [Btn(b === 'auto' ? 'primary' : 'secondary', [S(m.billings[b])])])], { t: 1, d: 6 }),
    F([[S(m.panel.group, 'cap dim')], ...['waiting', 'busy', 'idle'].map(gk => [Btn(gk === editing ? 'primary' : 'secondary', [S(m.groups[gk])], `editA:${gk}`)])], { t: 1, d: 6 }),
    F([[S(m.panel.density, 'cap dim')], ...Object.keys(PRESETS).map(d => [Btn(d === density ? 'primary' : 'secondary', [S(m.densities[d])])]),
      ...(density === null ? [[S(m.panel.custom, 'cap dim')]] : [])], { t: 1, d: 6 }),
    F(FIELDS.map(f => [Btn('plain', [S(`${fields.includes(f) ? '☑' : '☐'} ${m.fields[f]}`)])]), { t: 2, d: 14 }),
    L([], [Btn('plain', [S('switchboard · wide3751 ↗', 'cap dim')])]),
  ])
  // 頁首
  let header
  if (state.scene === 'unknown') {
    header = Bx({ border: 'bold', color: 'warn' }, [
      L([S(m.header.unknown, 'warn b')]),
      L([S(m.readFailed(`${ERROR_RAW}, open '${ERROR_PATH}'`), 'cap err')]),
    ])
  } else if (g.waiting.length) {
    header = Bx({ border: 'bold', color: 'warn' }, [
      L([S(`▲ ${m.status.needYou(g.waiting.length)}`, 'warn b')]),
      L([S([...breakdownOf(m, g.waiting), m.header.longestWait(LONGEST)].join(' · '), 'cap')]),
    ])
  } else {
    header = Bx({ border: 'round', color: 'ok' }, [
      L([S(m.header.none, 'ok sb')]),
      L([S([g.busy.length ? m.header.running(g.busy.length) : null, g.idle.length ? m.header.idle(g.idle.length) : null].filter(Boolean).join(' · '), 'cap dim')]),
    ])
  }
  const cardW = W - 4, rowW = W - 2
  const root = [
    L([], [Btn('plain', [S(`${m.view} ${state.panel === 'on' ? '▾' : '▸'}`, 'dim')], 'panel')]),
    state.panel === 'on' ? panel : null,
    header,
    ...g.waiting.map(c => Bx({ border: 'bold', color: c.status === 'errored' ? 'err' : 'warn' }, card(c, cardW))),
    g.busy.length ? L([S(`${m.groups.busy} ${g.busy.length}`, 'fn sb')]) : null,
    ...g.busy.map(c => Bx({ border: 'round' }, card(c, cardW))),
    g.idle.length ? L([S(`${m.groups.idle} ${g.idle.length}`, 'fn sb inactive')], [Btn('plain', [S(state.idleCollapsed ? '▸' : '▾', 'dim')], 'idle')]) : null,
    ...(state.idleCollapsed ? [] : g.idle.map(c => (opened(c.id) ? Bx({ border: 'round', dim: true }, card(c, cardW)) : G(GAP0, card(c, rowW), { t: 1, d: 11 })))),
    account,
  ]
  return G({ t: 1, d: 8 }, root)
}

// ── B：共識版 ────────────────────────────────────────────────────────
function buildB(m, cards, W) {
  const term = state.ui === 'terminal'
  const n = m.n
  const g = groupsOf(cards)
  const opened = id => state.expanded.has(id)
  const shows = (c, f) => (opened(c.id) ? PRESETS.detailed : DEFAULT_FIELDS[groupOf(c.status)]).includes(f)
  const XS = { t: 0, d: 4 }, MD = { t: 1, d: 14 }, COL = { t: 2, d: 12 }
  const busyGlyphColor = state.busyColor === 'text' ? 'text pend' : 'claude pend'
  const LOOK = { waiting: ['▲', 'warn'], busy: ['◉', busyGlyphColor], idle: ['○', 'inactive'], errored: ['✕', 'err'] }
  const italic = state.lang === 'en' ? ' i' : '' // 四-6：CJK 不用斜體

  const titleRow = (c, w) => {
    const [glyph, color] = LOOK[c.status]
    const label = c.kind ? m.kinds[c.kind] : null
    let src = sourceMark(c.source)
    let badges = c.tasks && shows(c, 'tasks') ? [S(`↻${c.tasks}`, 'cap text tab')] : []
    let current = c.current ? m.current : null
    const toggle = opened(c.id) ? '▾' : '▸'
    const leftW = dw(glyph) + 1 + (label ? dw(label) + 1 : 0)
    const rightW = () => (src ? dw(src) + 1 : 0) + (current ? dw(current) + 1 : 0) + badges.reduce((k, b) => k + dw(b.t) + 1, 0) + dw(c.age) + 1 + dw(toggle)
    // 三-3：空間不夠時依序拿掉徽章、拿掉來源符號，最後把「目前」換成 ✦
    if (term && w - leftW - rightW() - 3 < 8) badges = []
    if (term && w - leftW - rightW() - 3 < 8) src = null
    if (term && w - leftW - rightW() - 3 < 8 && current) current = '✦'
    const title = term ? truncate(c.title, w - leftW - rightW() - 3) : c.title
    const left = [
      S(glyph, `${color}${label ? ' b' : ''}`), S(' '),
      ...(label ? [S(label, `${color} b`), S(' ')] : []),
      Btn('plain', [S(title, c.status === 'idle' ? '' : 'sb', { shrink: true })], 'jump', '標題仍可點（捷徑），但不再教'),
    ]
    const right = [
      ...(src ? [S(src, 'dim', { title: c.source }), S(' ')] : []),
      ...(current ? [S(current, current === '✦' ? 'cap' : 'cap dim'), S(' ')] : []),
      ...badges.flatMap(b => [b, S(' ')]),
      S(c.age, 'cap dim tab'), S(' '),
      Btn('plain', [S(toggle, 'dim')], `expand:${c.id}`, opened(c.id) ? n.collapse(c.title) : n.expand(c.title)),
    ]
    return L(left, right)
  }
  const contextLine = c => {
    if (c.status === 'waiting' && c.question) return [L([S(m.asked(c.question.text), 'fn m')]), L([S(c.question.options, 'cap dim')])]
    if (c.status === 'waiting' && c.approval) return [L([S(c.approval, 'fn mono')])]
    if (c.status === 'errored') return [L([S(m.apiError, 'fn err')])]
    if (c.status === 'busy') {
      const act = `${c.tool} ${c.activity}` // 三-4：Edit 檔名，✎ 只代表 VS Code
      return [L([S([shows(c, 'progress') ? c.progress : null, shows(c, 'activity') ? act : null].filter(Boolean).join(' · '), 'fn')], null, { trunc: true })]
    }
    if (c.status === 'idle' && shows(c, 'reply') && c.reply) return [L([S(m.quoted(c.reply), `fn dim${italic}`)], null, { trunc: true })]
    return []
  }
  const metaStrip = (c, hotkey) => {
    const isOpen = opened(c.id)
    // 三-5：展開時 Context 和分支改由明細顯示（完整名稱），帶上不重複
    const where = [shows(c, 'location') ? c.loc : null, shows(c, 'branch') && c.branch && !isOpen ? branchLabel(c.branch) : null,
      shows(c, 'source') && c.source !== 'Desktop' ? c.source : null].filter(Boolean)
    const hasWork = c.branch && (c.add > 0 || c.del > 0 || c.branch.ahead > 0)
    const pr = c.pr && shows(c, 'pr')
      ? c.pr.state === 'MERGED' ? [Btn('plain', [S(`#${c.pr.n} ↗ ${n.merged}`, 'cap merged')], 'pr', n.prMerged(c.pr.n))]
        : c.pr.state === 'CLOSED' ? [Btn('plain', [S(`#${c.pr.n}`, 'cap inactive strike')], 'pr', n.prClosed(c.pr.n))]
          : [Btn('plain', [S(`#${c.pr.n} ↗`, 'cap ok')], 'pr', n.prOpen(c.pr.n))]
      : shows(c, 'pr') && hasWork && c.status !== 'idle' ? [S(n.noPr, 'cap dim')] : null
    const changes = shows(c, 'changes') && (c.add || c.del)
      ? [...(c.add ? [S(`+${c.add}`, 'cap add tab')] : []), ...(c.add && c.del ? [S(' ')] : []), ...(c.del ? [S(`−${c.del}`, 'cap del tab')] : [])] : null
    const items = [
      where.length ? [S(where.join(' · '), 'cap subtle')] : null,
      changes,
      shows(c, 'context') && c.ctx != null && !isOpen ? [S(`${n.ctx} ${c.ctx}%`, c.ctx >= 80 ? `cap tab ${usageColor(c.ctx)}` : 'cap dim tab')] : null,
      pr,
      shows(c, 'model') ? [S('Opus 5.5', 'cap dim')] : null,
      shows(c, 'environment') && c.worktree ? [S(m.environment.worktree, 'cap dim')] : null,
      shows(c, 'usage') && c.turns ? [S(m.turns(c.turns), 'cap dim tab')] : null,
    ].filter(Boolean)
    // 三-1、二-4：唯一的主要動作放在帶的右端，寬度不夠才換列；數字快捷鍵
    const end = hotkey ? [Btn('secondary', [S(String(hotkey), 'dim'), S(' '), S(m.goHandle)], 'jump', n.hotkey(hotkey))] : null
    return items.length || end ? [F(items, COL, end)] : []
  }
  const detail = c => {
    if (!opened(c.id)) return []
    const out = []
    if (c.ctx != null) out.push(L([S(m.fields.context, 'cap dim'), S(' '), S(usageBar(c.ctx), `cap tab ${usageColor(c.ctx)}`)]))
    if (c.branch) out.push(L([S(`${branchLabel(c.branch)} · ${m.versus(c.branch.base)}`, 'cap subtle')], null, { trunc: true }))
    out.push(L([S([m.environment.local, c.worktree ? m.environment.worktree : null].filter(Boolean).join(' · '), 'cap dim')]))
    if (c.connectors) out.push(F([[S(`${m.connectors(c.connectors.connected.length)}: ${c.connectors.connected.join(', ')}`, 'cap dim')], [S(`${m.needsAuth} ${c.connectors.needsAuth.join(', ')}`, 'cap warn')]], COL))
    out.push(L([S(c.path, 'cap dim')], null, { middle: true }))
    for (const [st, kind, label] of c.taskList || []) out.push(L([S(`${{ running: '↻', done: '✓' }[st]} ${m.taskKinds[kind]} ${label}`, st === 'done' ? 'cap dim' : 'cap')], null, { trunc: true }))
    return out
  }
  const card = (c, w, hotkey) => [titleRow(c, w), ...contextLine(c), ...metaStrip(c, hotkey), ...detail(c)]

  // 帳號用量：borderDimColor 退成頁尾，標籤補到同寬、整行 mono tabular
  const labels = RATES.map(r => m.account[r.kind])
  const lw = Math.max(...labels.map(dw))
  const account = Bx({ border: 'round', dim: true }, [
    L([S(m.account.title, 'fn sb dim')]),
    ...RATES.map((r, i) => L([S(`${labels[i]}${' '.repeat(lw - dw(labels[i]))} ${usageBar(r.p)}`, `cap mono tab ${usageColor(r.p)}`)], [S(m.account.resetsIn(r.reset), 'cap dim tab')])),
  ])
  // 設定面板：頁首下方、卡片上方；卡片內容在前、一般在後；只列有效欄位；完成按鈕
  const editing = state.editingB
  const valid = VALID[editing]
  const fields = DEFAULT_FIELDS[editing]
  const density = densityOf(fields, valid)
  const check = (on, label) => Btn('plain', [S(`${on ? '☑' : '☐'} ${label}`)], '', `${label}：${on ? n.on : n.off}`)
  const langRows = term
    ? [F([[S(m.panel.language, 'cap dim')], [Btn('primary', [S(m.panel.auto)])], ...n.localeNames.map(l => [Btn('secondary', [S(l)])])], { t: 1, d: 6 }),
       F([[S(m.panel.billing, 'cap dim')], ...Object.keys(m.billings).map(b => [Btn(b === 'auto' ? 'primary' : 'secondary', [S(m.billings[b])])])], { t: 1, d: 6 })]
    : [F([[S(m.panel.language, 'cap dim')], [Btn('select', [S(m.panel.auto)], '', `${m.panel.language}：${n.localeNames.join(' / ')}`)],
         [S(m.panel.billing, 'cap dim')], [Btn('select', [S(m.billings.auto)])]], { t: 1, d: 8 })]
  const panel = Bx({ border: 'round', dim: true, gap: { t: 1, d: 10 } }, [
    G(XS, [
      L([S(n.cardContent, 'fn sb'), S(' · ', 'fn dim'), S(m.groups[editing], 'fn sb')]),
      F([[S(m.panel.group, 'cap dim')], ...['waiting', 'busy', 'idle'].map(gk => [Btn(gk === editing ? 'primary' : 'secondary', [S(m.groups[gk])], `editB:${gk}`)])], { t: 1, d: 6 }),
      F([[S(m.panel.density, 'cap dim')], ...Object.keys(PRESETS).map(d => [Btn(d === density ? 'primary' : 'secondary', [S(m.densities[d])])]),
        ...(density === null ? [[S(m.panel.custom, 'cap dim')]] : [])], { t: 1, d: 6 }),
      F(valid.map(f => [check(fields.includes(f), m.fields[f])]), { t: 2, d: 14 }),
    ]),
    G(XS, [
      L([S(n.general, 'fn sb')]),
      F([[check(true, m.panel.autoOpen)], [check(false, m.panel.autoOpenCli)]], { t: 2, d: 10 }),
      ...langRows,
    ]),
    L([Btn('plain', [S('switchboard · wide3751 ↗', 'cap dim')])], [Btn('secondary', [S(n.done)], 'panel')]),
  ])
  const panelBlock = state.panel === 'on' ? panel : null

  const waitingTitle = [
    L([S('▲', 'hd warn b'), S(' '), S(m.status.needYou(g.waiting.length), 'hd warn b')]),
    L([S([...breakdownOf(m, g.waiting), m.status.longest(LONGEST)].join(' · '), 'cap tab')]),
  ]
  const waitingCards = g.waiting.map((c, i) => Bx({ border: 'bold', color: c.status === 'errored' ? 'err' : 'warn' }, card(c, W - 4, i < 9 ? i + 1 : null)))
  const glyphOn = state.secGlyph === 'on'
  const busyGroup = g.busy.length ? G(XS, [
    L([...(glyphOn ? [S('◉', 'fn claude pend'), S(' ')] : []), S(`${m.groups.busy} ${g.busy.length}`, 'fn sb claude')]),
    ...g.busy.map(c => Bx({ border: 'round' }, card(c, W - 4))),
  ]) : null
  const pad = { t: 2, d: 11 } // 三-9：終端機 paddingX 2，和卡片內文對齊
  const idleGroup = g.idle.length ? G(XS, [
    L([Btn('plain', [...(glyphOn ? [S('○', 'fn inactive pend'), S(' ')] : []), S(`${m.groups.idle} ${g.idle.length} ${state.idleCollapsed ? '▸' : '▾'}`, 'fn sb inactive')], 'idle', n.idleToggle(state.idleCollapsed))]),
    ...(state.idleCollapsed ? [] : [G(GAP0, g.idle.map(c => (opened(c.id) ? Bx({ border: 'round', dim: true }, card(c, W - 4)) : G(GAP0, card(c, W - 2 * pad.t), pad))))]),
  ]) : null

  const toolbar = L([], [Btn('plain', [S(`${m.view} ${state.panel === 'on' ? '▾' : '▸'}`, 'dim')], 'panel')])
  let top
  if (state.scene === 'unknown') {
    const isDouble = state.unkBorder === 'double'
    top = [
      Bx({ border: isDouble ? 'double' : 'round', color: 'warn', pend: true }, [
        L([S(m.header.unknown, 'warn b')]),
        L([S(n.readFailedShort, 'fn'), S(ERROR_RAW, 'fn err')]),
        L([S(ERROR_PATH, 'cap dim')], null, { middle: true }),
        L([S(n.retry, 'cap dim'), S(' · ', 'cap dim'), Btn('plain', [S(n.troubleshoot, 'cap sugg')], '', 'README#troubleshooting')]),
      ]),
      panelBlock,
      g.waiting.length ? G(XS, [...waitingTitle, ...waitingCards]) : null,
    ]
  } else if (g.waiting.length) {
    top = [G(XS, [...waitingTitle, panelBlock, ...waitingCards])]
  } else {
    top = [L([S(m.header.none, 'ok sb')]), cards.length === 0 ? L([S(m.header.noOthers, 'cap dim')]) : null, panelBlock]
  }
  return G(MD, [toolbar, ...top, busyGroup, idleGroup, account])
}

// ── 周邊：Pane 標題、監看視窗關著時的按鈕、手動關掉後的 toast ─────────────
function extrasOf(m, cards) {
  const count = state.scene === 'unknown' ? null : groupsOf(cards).waiting.length
  const paneCount = groupsOf(cardsOf(state.lang, state.scene === 'calm' ? 'calm' : 'wait')).waiting.length
  if (state.variant === 'A') {
    return {
      title: paneCount ? `Switchboard · ${paneCount}` : 'Switchboard',
      band: L([Btn('secondary', [S(count ? m.band.openWaiting(count) : m.band.open)])]),
      toast: Bx({ border: 'round' }, [L([S(m.closed(m.view, m.panel.autoOpen), 'fn')])]),
    }
  }
  const n = m.n
  return {
    title: paneCount ? `Switchboard · ▲${paneCount}` : 'Switchboard',
    band: L([count
      ? Btn('secondary', [S(`▲${count}`, 'warn b'), S(` ${n.bandNeed} · ${n.bandOpen}`)], '', n.bandLabel(count))
      : Btn('secondary', [S(n.bandOpenFull)])]),
    toast: Bx({ border: 'round', gap: { t: 0, d: 6 } }, [L([S(n.toast(m.panel.autoOpen), 'fn')]), L([Btn('secondary', [S(n.never)])])]),
  }
}

// ── 畫出整頁 ─────────────────────────────────────────────────────────
const VARIANTS = [{ key: 'A', name: '現況' }, { key: 'B', name: '共識版' }]
const COLUMNS = 80, BODY = COLUMNS - 4

function render() {
  try { history.replaceState(null, '', `#${state.variant}`) } catch { /* 預覽環境可能不允許 */ }
  const m = MSG[state.lang]
  const cards = cardsOf(state.lang, state.scene)
  const isB = state.variant === 'B'
  const tree = (isB ? buildB : buildA)(m, cards, BODY)
  const ex = extrasOf(m, cards)

  // 控制列
  document.getElementById('controls').innerHTML = CONTROLS.map(c => `
    <div class="group${c.pending ? ' pending' : ''}"><span>${c.label}</span><div class="seg">${c.options.map(([v, t]) =>
      `<button data-k="${c.key}" data-v="${v}" aria-pressed="${state[c.key] === v}"${c.pending && !isB ? ' disabled style="opacity:.45;cursor:not-allowed"' : ''}>${t}</button>`).join('')}</div></div>`).join('')

  // 模擬畫面
  const stage = document.getElementById('stage')
  stage.dataset.sim = state.sim
  let html
  if (state.ui === 'terminal') {
    const titleTxt = ` ${ex.title} `
    const top = `╭─${titleTxt}${'─'.repeat(COLUMNS - 7 - dw(titleTxt))} ✕ ─╮`
    const lines = [
      [S(top, 'frame')],
      ...termLines(tree, BODY).map(l => [S('│', 'frame'), S(' '), ...fit(l, BODY), S(' '), S('│', 'frame')]),
      [S(`╰${'─'.repeat(COLUMNS - 2)}╯`, 'frame')],
      [],
      [S('─'.repeat(COLUMNS), 'frame')], [S('> ', 'dim'), S('輸入訊息…', 'dim')], [S('─'.repeat(COLUMNS), 'frame')],
    ]
    const band = [...termLines(ex.band, COLUMNS), [S('─'.repeat(COLUMNS), 'frame')], [S('> ', 'dim')], [S('─'.repeat(COLUMNS), 'frame')]]
    html = `<div class="scroller"><div class="term">${termHtml(lines)}</div></div>
      <div class="extras">
        <div class="extra" style="width:100%"><div class="cap-t">監看視窗關著時：輸入框上方的按鈕</div><div class="scroller"><div class="term">${termHtml(band)}</div></div></div>
        <div class="extra" style="width:100%"><div class="cap-t">手動關掉監看視窗後的 toast（近似畫法）</div><div class="scroller"><div class="term">${termHtml(termLines(ex.toast, COLUMNS))}</div></div></div>
      </div>`
  } else {
    html = `<div class="desk"><div class="bar"><span>${esc(ex.title)}</span><span class="x">✕</span></div><div class="body">${deskHtml(tree)}</div></div>
      <div class="extras">
        <div class="extra"><div class="cap-t">監看視窗關著時：輸入框上方的按鈕</div><div class="desk-mini desk">${deskHtml(ex.band)}<div class="inputbox">Reply…</div></div></div>
        <div class="extra"><div class="cap-t">手動關掉監看視窗後的 toast（近似畫法）</div><div class="desk-mini desk">${deskHtml(ex.toast)}</div></div>
      </div>`
  }
  stage.innerHTML = html

  // 旁邊：待確認
  const pendOpt = k => CONTROLS.find(c => c.key === k).options.find(([v]) => v === state[k])[1]
  document.getElementById('side').innerHTML = isB ? `
    <div class="card"><h3><span class="tag">待確認</span>實機確認前的暫定選項</h3>
      <p class="muted" style="margin:0 0 6px">畫面上虛線框起來的地方會隨這三個開關改變。</p>
      <ul>
        <li><b>①</b> 工作中卡片的 ◉ 顏色：<b>${pendOpt('busyColor')}</b></li>
        <li><b>②</b> 看不到狀態的外框：<b>${pendOpt('unkBorder')}</b>${state.scene !== 'unknown' ? '<span class="muted">（切到「看不到狀態」才看得到）</span>' : ''}</li>
        <li><b>③</b> 工作中、閒置標題前的 glyph：<b>${pendOpt('secGlyph')}</b></li>
      </ul></div>
    <div class="card"><h3><span class="tag">待確認</span>這個原型不改、但也要實機看的</h3>
      <ul>
        <li>位置、分支的 <code>subtle</code> 色在兩個主題下的對比</li>
        <li>終端機 Select 展開後的高度（終端機面板暫時維持按鈕列）</li>
        <li>CJK 在 iTerm／Terminal.app 能不能畫粗體（影響 ③）</li>
      </ul></div>` : `
    <div class="card"><h3>現況</h3><p class="muted" style="margin:0">A 照目前程式畫，不受三個「待確認」開關影響。切到 B 看共識版和待確認的選項。</p></div>`

  // 條目清單
  document.getElementById('listTitle').textContent = isB ? '本版套用的共識條目（畫面上看得到的）' : '現況對應的問題（切到 B 看共識怎麼改）'
  document.getElementById('applied').innerHTML = ITEMS.filter(it => it.when()).map(it =>
    `<li><span class="id">${it.id}</span>${esc(isB ? it.b : it.a)}</li>`).join('')
  document.getElementById('unseen').innerHTML = UNSEEN.map(([id, t]) => `<li><span class="id">${id}</span>${esc(t)}</li>`).join('')

  // 目前狀態
  const v = VARIANTS.find(x => x.key === state.variant)
  document.getElementById('vlabel').textContent = `${v.key} · ${v.name}`
  const label = k => CONTROLS.find(c => c.key === k).options.find(([x]) => x === state[k])[1]
  const opened = cards.filter(c => state.expanded.has(c.id)).map(c => c.title)
  document.getElementById('info').textContent = [
    `版本 ${v.key}（${v.name}）`, label('ui'), label('scene'), label('lang'), `${label('sim')}主題`, `設定面板${label('panel')}`,
    isB ? `待確認：①${label('busyColor')} ②${label('unkBorder')} ③${label('secGlyph')}` : null,
    `展開：${opened.length ? opened.join('、') : '無'}`, state.idleCollapsed ? '閒置已收合' : null,
    state.panel === 'on' ? `面板編輯：${MSG[state.lang].groups[isB ? state.editingB : state.editingA]}` : null,
  ].filter(Boolean).join(' · ')
}

// ── 互動 ─────────────────────────────────────────────────────────────
document.getElementById('controls').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]')
  if (!b || b.disabled) return
  state[b.dataset.k] = b.dataset.v
  render()
})
document.getElementById('stage').addEventListener('click', e => {
  const el = e.target.closest('[data-act]')
  if (!el) return
  const [act, arg] = el.dataset.act.split(':')
  if (act === 'expand') { const id = Number(arg); state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id) }
  else if (act === 'panel') state.panel = state.panel === 'on' ? 'off' : 'on'
  else if (act === 'idle') state.idleCollapsed = !state.idleCollapsed
  else if (act === 'editA') state.editingA = arg
  else if (act === 'editB') state.editingB = arg
  else return // 跳轉、PR 連結：原型不做事
  render()
})
const cycle = d => {
  const i = VARIANTS.findIndex(v => v.key === state.variant)
  state.variant = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key
  render()
}
document.getElementById('prev').onclick = () => cycle(-1)
document.getElementById('next').onclick = () => cycle(1)
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return
  if (e.key === 'ArrowLeft') cycle(-1)
  if (e.key === 'ArrowRight') cycle(1)
})
addEventListener('hashchange', () => { const v = readHash(); if (v !== state.variant) { state.variant = v; render() } })
render()
</script>
